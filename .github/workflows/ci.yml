# CI workflow for LLM Universal Adapter
name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest pytest-mock
          
      - name: Code Formatting & Linting (Ruff)
        run: ruff check .

      - name: Static Type Checking (Mypy)
        run: mypy src/
        
      - name: Run Unit Tests
        run: pytest tests/ --maxfail=1 --disable-warnings